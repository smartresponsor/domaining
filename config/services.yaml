  App\Domaining\ServiceInterface\Export\DomainStateExportServiceInterface:
    alias: App\Domaining\Service\Export\DomainStateExportService

  App\Domaining\ServiceInterface\Contract\DomainContractGovernanceServiceInterface:
    alias: App\Domaining\Service\Contract\DomainContractGovernanceService

  App\Domaining\ServiceInterface\Manifest\DomainReleaseManifestServiceInterface:
    alias: App\Domaining\Service\Manifest\DomainReleaseManifestService

  App\Domaining\ServiceInterface\Review\DomainReleaseReviewServiceInterface:
